# محیط توسعه.
#
# پستگرس و MinIO از برش بعدی لازم می‌شوند، ولی الان بالا می‌آیند تا خط
# استقرار از روز اول کامل و آزمایش‌شده باشد — نه اینکه آخر پروژه غافلگیر شویم.

name: jozveyar-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jozveyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: jozveyar
    ports: ['5432:5432']
    volumes: ['./data/postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jozveyar -d jozveyar']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # استوریج S3-سازگار لوکال. در تولید فقط سه متغیر محیطی عوض می‌شود
  # و به پارس‌پک یا آروان وصل می‌شویم — بدون تغییر کد.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-jozveyar}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-devpassword}
    ports: ['9000:9000', '9001:9001']
    volumes: ['./data/minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
