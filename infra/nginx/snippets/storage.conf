# مسیر هم‌مبدأ استوریج (ADR-024).
#
# مرورگر تکه‌های فایل را با URL امضاشده به `https://jozveyar.com/jozveyar/…`
# می‌فرستد و اینجا مستقیم به Garage داده می‌شوند. بایت‌ها از کانتینر web رد
# نمی‌شوند. هم‌مبدأ بودن یعنی نه دامنه و گواهی تازه، نه CORS و preflight به‌ازای
# هر تکه — که روی موبایل پرتأخیر گران است.
#
# نام مسیر همان نام باکت است (S3_BUCKET)، چون آدرس‌ها path-style‌اند. اگر باکت
# عوض شد، این هم عوض شود.
#
# جدا از jozveyar.conf نگه داشته شده تا همین فایل، بدون کپی، در آزمایش هم
# استفاده شود.

location /jozveyar/ {
    # فقط PUT تکه. بدون GET: هیچ فایلی از این مسیر خوانده نمی‌شود، حتی با
    # URL امضاشده. دانلود برای کارگر و پنل از مسیر داخلی است.
    limit_except PUT { deny all; }

    # سقف سخت هر تکه: ۸ مگابایت تکه + حاشیه. امضای Content-Length هم هر اندازهٔ
    # دیگری را رد می‌کند؛ این لایهٔ دوم، قبل از رسیدن به استوریج است.
    client_max_body_size 9m;
    client_body_timeout 120s;

    # تکه را روی دیسک Nginx بافر نکن؛ مستقیم رد کن.
    proxy_request_buffering off;
    proxy_buffering off;

    # Host باید دقیقاً همانی باشد که مرورگر فرستاده و امضا شده.
    # `$http_host` پورت را هم نگه می‌دارد؛ `$host` نه.
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    proxy_pass http://garage:3900;
}
