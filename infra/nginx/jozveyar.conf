# Nginx جزوه‌یار.
#
# سه کار: پایان‌دهی TLS، سرو فایل‌های ایستا، و پروکسی بقیه به اپ نکست.
#
# نکتهٔ مهم برای این پروژه: `client_max_body_size` باید بزرگ باشد چون سقف فایل
# ۱.۵ گیگابایت است. ولی از برش بعدی، فایل مستقیم به آبجکت استوریج آپلود می‌شود
# و از اینجا رد نمی‌شود — این عدد فقط برای مسیر پشتیبان می‌ماند.

upstream jozveyar_web {
    server web:3000;
    keepalive 32;
}

# HTTP فقط برای تمدید گواهی و هدایت به HTTPS.
server {
    listen 80;
    server_name jozveyar.com www.jozveyar.com;

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jozveyar.com$request_uri;
    }
}

# www به دامنهٔ اصلی — یک نسخهٔ قانونی، برای سئو مهم است.
server {
    listen 443 ssl;
    http2 on;
    server_name www.jozveyar.com;

    ssl_certificate     /etc/nginx/certs/live/jozveyar.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/jozveyar.com/privkey.pem;

    return 301 https://jozveyar.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jozveyar.com;

    ssl_certificate     /etc/nginx/certs/live/jozveyar.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/jozveyar.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # سقف آپلود مسیر پشتیبان. مسیر اصلی presigned است و از اینجا نمی‌گذرد.
    client_max_body_size 1600m;
    client_body_timeout 300s;

    # فایل بزرگ را روی دیسک بافر نکن — حافظه و I/O الکی مصرف می‌شود.
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS فقط بعد از اینکه مطمئن شدیم HTTPS پایدار است روشن شود:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # دارایی‌های ساخت نکست هش‌دار هستند، پس تا ابد قابل کش‌اند.
    location /_next/static/ {
        proxy_pass http://jozveyar_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # قلم‌ها لوکال‌اند و هیچ‌وقت عوض نمی‌شوند.
    location /fonts/ {
        proxy_pass http://jozveyar_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://jozveyar_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
