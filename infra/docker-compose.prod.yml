# تولید — روی VPS.
#
# ایمیج‌ها اینجا ساخته نمی‌شوند: از بیرون می‌آیند (infra/deploy.sh).
# بیلد از داخل ایران به رجیستری npm نمی‌رسد و روی همان مرحله گیر می‌کند.

name: jozveyar

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/jozveyar.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-webroot:/var/www/certbot
    depends_on:
      web: { condition: service_healthy }
      # Nginx نام `garage` را موقع بالا آمدن حل می‌کند؛ بدون کانتینرش بالا نمی‌آید.
      garage: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: jozveyar/web:${TAG:-latest}
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-640m}
    env_file: [../.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    expose: ['3000']

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jozveyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
      POSTGRES_DB: jozveyar
    # سقف حافظه: روی سرور کوچک، یک کانتینر پرمصرف نباید بقیه را بکشد.
    # برای سرور بزرگ‌تر این اعداد را در .env بالا ببرید.
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    volumes: ['./data/postgres:/var/lib/postgresql/data']
    # بیرون شبکهٔ داکر پورتی باز نمی‌شود.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jozveyar -d jozveyar']
      interval: 10s
      timeout: 5s
      retries: 5

  # استوریج S3-سازگار (ADR-023). پورتی بیرون باز نمی‌شود: مرورگر از مسیر
  # `/jozveyar/` در Nginx می‌رسد و اپ از شبکهٔ داخلی. رمزها را
  # infra/setup-storage.sh یک بار در .env می‌سازد.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
    mem_limit: ${GARAGE_MEM_LIMIT:-512m}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./data/garage/meta:/var/lib/garage/meta
      - ./data/garage/data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 30s
      timeout: 10s
      retries: 3

  # کارگر اسناد (ADR-005، ADR-025): صف `jobs` را از پستگرس برمی‌دارد، فایل را
  # از Garage می‌خواند، همهٔ صفحات را تحلیل می‌کند. ایمیجش را deploy-bundle.sh
  # از بستهٔ CI می‌سازد. حالت ندارد — کارگر دوم، روی همین سرور یا نود دیگر،
  # فقط یک نمونهٔ دیگر از همین سرویس با همین .env است.
  docworker:
    image: jozveyar/docworker:${TAG:-latest}
    restart: unless-stopped
    env_file: [../.env]
    # تحلیل یک صفحه در لحظه است، ولی PyMuPDF روی PDF سنگین جا می‌خواهد.
    mem_limit: ${DOCWORKER_MEM_LIMIT:-768m}
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }
      # وب مهاجرت‌ها را قبل از اولین پاسخ اجرا می‌کند؛ پس «وب سالم» یعنی جدول
      # `jobs` هست. بدون این، کارگر در اولین استقرار زودتر بالا آمد و کرش کرد.
      web: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1
    volumes: ['./data/redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 3
