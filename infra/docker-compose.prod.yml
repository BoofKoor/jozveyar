# تولید — روی VPS.
#
# ایمیج‌ها اینجا ساخته نمی‌شوند: از بیرون می‌آیند (infra/deploy.sh).
# بیلد از داخل ایران به رجیستری npm نمی‌رسد و روی همان مرحله گیر می‌کند.

name: jozveyar

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/jozveyar.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-webroot:/var/www/certbot
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: jozveyar/web:${TAG:-latest}
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-640m}
    env_file: [../.env]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    expose: ['3000']

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jozveyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD لازم است}
      POSTGRES_DB: jozveyar
    # سقف حافظه: روی سرور کوچک، یک کانتینر پرمصرف نباید بقیه را بکشد.
    # برای سرور بزرگ‌تر این اعداد را در .env بالا ببرید.
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    volumes: ['./data/postgres:/var/lib/postgresql/data']
    # بیرون شبکهٔ داکر پورتی باز نمی‌شود.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jozveyar -d jozveyar']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1
    volumes: ['./data/redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 3
