<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  پوشهٔ فونت‌های خصوصی (ADR-027): کارگر آن را با پیشوند `fonts/` باکت هم‌گام
  می‌کند (docworker/fonts.py). فونتی که اینجا باشد بر نگاشت‌های
  61-jozveyar-aliases.conf مقدم است، چون آنها همه `accept` هستند.
-->
<fontconfig>
  <dir>/var/lib/docworker/fonts</dir>
</fontconfig>
