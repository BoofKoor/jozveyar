  <alias binding="same"><family>IRANYekanX</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Iran Sans</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Vazir</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Vazir FD</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Vazirmatn FD</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Sahel</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Samim</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Shabnam</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Tanha</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Estedad</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>Dana</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>B Koodak</family><accept><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>B Traffic</family><accept><family>Vazirmatn</family></accept></alias>

</fontconfig>
