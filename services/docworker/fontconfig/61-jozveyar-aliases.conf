<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  نگاشت فونت‌های رایج Word ایرانی به نزدیک‌ترین فونت آزادی که در ایمیج هست (ADR-027).

  چرا مهم است: همان سند Word فارسی با Vazirmatn ۱۱۶ صفحه شد، با فونت جایگزین
  بی‌قاعده ۹۳، با Nazli ۹۰ و با Tahoma ۸۰ — یعنی فونت مستقیماً تعداد صفحه و قیمت را
  عوض می‌کند. نگاشت، هم‌اندازه بودن را تضمین نمی‌کند؛ فقط شکل را نزدیک نگه می‌دارد و
  جلوی افتادن به فونت نامربوط را می‌گیرد. کارگر فونت جایگزین‌شده را ثبت و اعلام می‌کند.

  همه `accept` است، نه `prefer`: اگر خود فونت (مثلاً B Nazanin که صاحب پروژه در
  پیشوند خصوصی `fonts/` باکت گذاشته) موجود باشد، خودش انتخاب می‌شود و این نگاشت
  فقط وقتی به کار می‌آید که نباشد.

  پایهٔ این انتخاب‌ها قاعدهٔ خود fontconfig از پروژهٔ فارسی‌وب است
  (65-fonts-persian.conf) که «Nazanin» را به Nazli می‌برد؛ این فایل همان منطق را
  به نام‌های سری B و IR و قلم‌های وب امروزی گسترش می‌دهد.
-->
<fontconfig>

  <!-- نسخ متن: نازنین، لوتوس، زر، میترا، بدر… ← Nazli -->
  <alias binding="same"><family>B Nazanin</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>IRNazanin</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>IR Nazanin</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>B Lotus</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>IRLotus</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>IR Lotus</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>B Zar</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>IRZar</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>IR Zar</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>XB Zar</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>Zar</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>B Mitra</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>IRMitra</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>Mitra</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>B Badr</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>IRBadr</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>Badr</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>B Roya</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
