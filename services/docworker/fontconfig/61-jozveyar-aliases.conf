  <alias binding="same"><family>IRTitr</family><accept><family>Titr</family><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>IR Titr</family><accept><family>Titr</family><family>Vazirmatn</family></accept></alias>
  <alias binding="same"><family>XB Titre</family><accept><family>Titr</family><family>Vazirmatn</family></accept></alias>

  <!-- تزئینی ← Homa -->
