  <alias binding="same"><family>B Yagut</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>XB Yagut</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
  <alias binding="same"><family>XB Niloofar</family><accept><family>Nazli</family><family>Noto Naskh Arabic</family></accept></alias>
