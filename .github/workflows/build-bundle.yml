# ساخت بستهٔ آمادهٔ اجرا در گیت‌هاب اکشنز.
#
# چرا: سرور ایرانی نمی‌تواند ۴۹۰ مگابایت بسته را از npm بکشد — اتصال‌ها
# با ECONNRESET و ERR_SOCKET_TIMEOUT می‌افتند، مخصوصاً روی فایل‌های بزرگ.
# ولی همان سرور به گیت‌هاب می‌رسد (git clone و raw.githubusercontent بارها
# جواب داده‌اند).
#
# پس بیلد اینجا انجام می‌شود و سرور فقط یک فایل ۶۷ مگابایتی دانلود می‌کند:
# خروجی standalone نکست، که فقط ۱۹ بستهٔ زمان اجرا دارد نه ۹۹ بستهٔ بیلد.

name: build-bundle

on:
  push:
    branches: [main]
  # روی PR فقط تست و بیلد — هیچ بسته‌ای منتشر نمی‌شود (شرط‌های `if` پایین).
  # بدون این، تست‌ها اولین بار بعد از merge اجرا می‌شدند.
  pull_request:
  # اجرای دستی روی هر شاخه‌ای جز main هم فقط تست و بیلد است: انتشار فقط از
  # main، وگرنه بستهٔ یک شاخهٔ نیمه‌کاره جای بستهٔ تولید را می‌گرفت.
  workflow_dispatch:

permissions:
  contents: write

# اجراهای main پشت‌سرهم، نه هم‌زمان: دو انتشار هم‌زمان روی یک تگ، بسته‌ای
# نیمه‌تازه نیمه‌کهنه می‌سازد. روی PR اجرای کهنه لغو می‌شود.
concurrency:
  group: build-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: ubuntu-latest

    # پستگرس واقعی، همان نسخهٔ تولید.
    #
    # تست‌های یکپارچگی بدون `DATABASE_URL` خودشان را رد می‌کنند، پس بدون این
    # سرویس، CI سبز می‌شد بدون اینکه حتی یک مهاجرت اجرا شده باشد — و کشف اینکه
    # SQL خراب است می‌افتاد به لحظهٔ استقرار روی سرور.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jozveyar
          POSTGRES_PASSWORD: jozveyar
          POSTGRES_DB: jozveyar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jozveyar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # هیچ درخواستی از CI به sms.ir یا زیبال واقعی نمی‌رود (برش ۷، ADR-049 و ۰۵۰، سؤال ۱۲۸): میزبان‌های API پیش از هر تست به همین
      # ماشین؛ تست‌ها با سرور ساختگی به شکل مستند کار می‌کنند (`packages/sms/mock`، `packages/payments/mock`). سنجش فقط با خواندن نام از
      # /etc/hosts، بی هیچ درخواست.
      - name: دیوار sms.ir و زیبال
        run: |
          set -eu
          printf '127.0.0.1 api.sms.ir gateway.zibal.ir api.zibal.ir\n::1 api.sms.ir gateway.zibal.ir api.zibal.ir\n' | sudo tee -a /etc/hosts > /dev/null
          for host in api.sms.ir gateway.zibal.ir api.zibal.ir; do
            getent ahosts "$host" | awk '{print $1}' | sort -u > "$RUNNER_TEMP/wall"
            if grep -vxE '127\.0\.0\.1|::1' "$RUNNER_TEMP/wall"; then echo "دیوار $host را نگرفت" >&2; exit 1; fi
            test -s "$RUNNER_TEMP/wall"
          done

      # پیکربندی Nginx پیش از ادغام، نه هنگام استقرار: همان ایمیج و همان دو پوشه‌ای که compose تولید وصل می‌کند، با
      # گواهی خودامضا و نام سرویس‌ها روی 127.0.0.1. روی سرور nginx-apply.sh باز هم پیش از به کار انداختن می‌سنجد.
      - name: پیکربندی Nginx
        run: |
          set -eux
          C="$RUNNER_TEMP/certs/live/jozveyar.com"
          mkdir -p "$C"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=jozveyar.com \
            -keyout "$C/privkey.pem" -out "$C/fullchain.pem"
          docker run --rm --add-host web:127.0.0.1 --add-host garage:127.0.0.1 --add-host admin:127.0.0.1 \
            -v "$PWD/infra/nginx/conf.d:/etc/nginx/conf.d:ro" -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$RUNNER_TEMP/certs:/etc/nginx/certs:ro" nginx:1.27-alpine nginx -t

      # نسخه عمداً اینجا نوشته نمی‌شود: اکشن آن را از فیلد `packageManager`
      # در package.json می‌خواند. اگر هر دو جا نوشته شود و روزی یکی به‌روز
      # شود و دیگری نه، اکشن با خطای «چند نسخه» می‌افتد.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Garage واقعی، همان ایمیج تولید (ADR-023).
      #
      # مثل پستگرس: تست‌های یکپارچگی استوریج بدون `S3_ENDPOINT` خودشان را رد
      # می‌کنند، پس بدون این مرحله CI سبز می‌شد بدون اینکه امضای ما حتی یک
      # بار با سرور واقعی سنجیده شده باشد. سرویس `services:` نمی‌شود چون
      # Garage فایل پیکربندی می‌خواهد و سرویس‌های اکشنز mount نمی‌گیرند.
      - name: استوریج
        run: |
          set -eux
          docker run -d --name garage -p 3900:3900 \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" \
            -v "$PWD/infra/garage.toml:/etc/garage.toml:ro" \
            dxflrs/garage:v2.4.1
          echo "S3_ACCESS_KEY=GK$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          echo "S3_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: آماده‌سازی استوریج
        run: ./infra/garage-init.sh
        env:
          GARAGE_CMD: docker exec garage /garage
          S3_BUCKET: jozveyar

      # دروازه: بستهٔ شکسته منتشر نمی‌شود.
      #
      # `DATABASE_URL` اینجا تست‌های یکپارچگی را هم روشن می‌کند: مهاجرت‌ها روی
      # پستگرس واقعی اعمال می‌شوند و محدودیت‌های تعرفه سنجیده می‌شوند.
      - name: تست واحد و یکپارچگی
        run: pnpm test
        env:
          DATABASE_URL: postgresql://jozveyar:jozveyar@127.0.0.1:5432/jozveyar
          S3_ENDPOINT: http://127.0.0.1:3900
          S3_BUCKET: jozveyar

      # ── کارگر اسناد: ایمیج پایه (ADR-027) ─────────────────────────────────
      #
      # LibreOffice، فونت‌ها و چرخ‌های پایتون در یک ایمیج پایه که شناسه‌اش هش
      # ورودی‌هایش است. اگر همین شناسه قبلاً منتشر شده، همان برداشته می‌شود
      # (چند ثانیه)؛ اگر نه، اینجا ساخته می‌شود. سرور هیچ‌وقت نمی‌سازدش.
      - name: شناسهٔ ایمیج پایهٔ کارگر
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          id=$(services/docworker/base-id.sh)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "image=jozveyar/docworker-base:$id" >> "$GITHUB_OUTPUT"
          if gh release view "docworker-base-$id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "ایمیج پایه $id از قبل منتشر شده"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "ایمیج پایه $id تازه است — ساخته می‌شود"
          fi

      - name: ایمیج پایه — نسخهٔ منتشرشده
        if: steps.base.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          rm -rf base-dl
          gh release download "docworker-base-${{ steps.base.outputs.id }}" --repo "$GITHUB_REPOSITORY" --dir base-dl
          (cd base-dl && sha256sum -c jozveyar-docworker-base.sha256)
          cat base-dl/jozveyar-docworker-base.tar.gz.part-* | docker load
          rm -rf base-dl

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # چرخ‌ها برای پایتون ۳.۱۲ لینوکس، همین‌جا: داخل ساخت ایمیج شبکه لازم نیست.
      - name: ایمیج پایه — ساخت
        if: steps.base.outputs.published != 'true'
        run: |
          set -eux
          D=services/docworker
          rm -rf base-ctx && mkdir -p base-ctx/wheels
          pip download --only-binary=:all: --python-version 3.12 --implementation cp \
            --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 \
            --platform manylinux2014_x86_64 -r $D/requirements.txt -d base-ctx/wheels
          cp -r $D/Dockerfile.base $D/requirements.txt $D/fonts $D/fontconfig base-ctx/
          docker build -f base-ctx/Dockerfile.base -t "${{ steps.base.outputs.image }}" base-ctx
          rm -rf base-ctx
          docker image ls "${{ steps.base.outputs.image }}"

      # تست کارگر داخل همان ایمیجی که روی سرور اجرا می‌شود: همان LibreOffice،
      # همان فونت‌ها. بعد از `pnpm test` چون آن مهاجرت‌ها را اعمال کرده؛ تست‌های
      # یکپارچگی روی همان پستگرس و Garage اجرا می‌شوند (شبکهٔ میزبان).
      # کل مخزن mount می‌شود، نه فقط پوشهٔ کارگر: تست هم‌ارزی بردارها را از
      # packages/analysis/parity می‌خواند (ADR-025).
      - name: تست کارگر اسناد
        run: |
          docker run --rm --network host --user root \
            -e DATABASE_URL -e S3_ENDPOINT -e S3_BUCKET -e S3_ACCESS_KEY -e S3_SECRET_KEY \
            -v "$PWD:/src" -w /src/services/docworker "${{ steps.base.outputs.image }}" \
            sh -c 'pip install -q --no-cache-dir --root-user-action=ignore -r requirements-dev.txt \
                   && python -m pytest -q -p no:cacheprovider tests'
        env:
          DATABASE_URL: postgresql://jozveyar:jozveyar@127.0.0.1:5432/jozveyar
          S3_ENDPOINT: http://127.0.0.1:3900
          S3_BUCKET: jozveyar

      # بستهٔ کارگر: فقط کد و شناسهٔ پایه — چند کیلوبایت. سرور پایه را از
      # انتشار جدای خودش می‌گیرد، فقط وقتی شناسه‌اش را ندارد.
      - name: بستهٔ کارگر اسناد
        run: |
          set -eux
          D=services/docworker
          rm -rf dw && mkdir -p dw
          cp -r $D/Dockerfile $D/docworker dw/
          echo "${{ steps.base.outputs.id }}" > dw/BASE
          find dw -name __pycache__ -prune -exec rm -rf {} +
          # بستهٔ تکرارپذیر: بدون زمان و مالک، پس تا محتوا عوض نشده اثر انگشت
          # هم عوض نمی‌شود و سرور کارگر را بی‌دلیل دوباره نمی‌سازد.
          tar --sort=name --mtime='2000-01-01 00:00Z' --owner=0 --group=0 --numeric-owner \
            -cf - -C dw . | gzip -n > jozveyar-docworker.tar.gz
          sha256sum jozveyar-docworker.tar.gz | cut -d' ' -f1 > jozveyar-docworker.sha256
          ls -lh jozveyar-docworker.tar.gz

      # همان ایمیجی که سرور می‌سازد، اینجا ساخته و امتحان می‌شود: اگر چیزی
      # جا افتاده یا با پایه نمی‌خواند، همین‌جا می‌شکند نه روی سرور.
      - name: آزمایش ایمیج کارگر
        run: |
          set -eux
          docker build --build-arg "BASE_IMAGE=${{ steps.base.outputs.image }}" -t docworker-smoke dw
          docker run --rm docworker-smoke python -c "import fitz, numpy, psycopg, PIL, pillow_heif, docworker.jobs, docworker.fonts, docworker.convert, docworker.orders, docworker.printfile, docworker.ticket, docworker.retention, docworker.jalali, docworker.postfile, docworker.shipments; print(fitz.VersionBind, docworker.ticket.font_dir())"
          docker run --rm docworker-smoke soffice --version
          # تبدیل واقعی همان‌طور که روی سرور اجرا می‌شود (ADR-028): کاربر بی‌امتیاز
          # docworker، پایتون PID 1 بی init، پروفایل مهارشده، بی‌شبکه.
          docker run --rm -i --network none -v "$PWD/services/docworker/tests:/app/tests:ro" docworker-smoke python - <<'PY'
          import os, tempfile
          import fitz
          from docworker import convert, sandbox
          from tests.samples import docx_paragraph, make_docx, persian_text
          walls = sandbox.protect_worker()
          assert os.getpid() == 1 and all(walls.values()), walls
          work = tempfile.mkdtemp()
          make_docx(os.path.join(work, "upload"), [docx_paragraph(persian_text(i + 1, 40), "B Nazanin") for i in range(120)])
          office = convert.LibreOffice()
          result = convert.to_pdf(os.path.join(work, "upload"), work, office)
          with fitz.open(result.pdf_path) as doc:
              print(result.record(), "pages:", doc.page_count)
          # LibreOffice‌ای که بعد از تبدیل مانده بود و کشته شد — باید خالی باشد.
          print("stragglers:", office.stragglers)
          PY
          docker image ls docworker-smoke

      - name: بیلد
        run: pnpm --filter @jozveyar/web build

      # پنل ادمین (برش ۴، ADR-037): اپ جدا، و دستور سرور (`dist/cli.mjs`، با esbuild) کنار آن.
      - name: بیلد پنل
        run: pnpm --filter @jozveyar/admin build

      # تست سرتاسری مرورگر روی همین build تولیدی (ADR-018) — دروازه، مثل تست واحد: بستهٔ
      # شکسته منتشر نمی‌شود. بدون استوریج و پایگاه داده (`S3_ENDPOINT` و `DATABASE_URL` فقط
      # در مراحل خودشان‌اند)، همان حالتی که `flow.spec.ts`، `jozve.spec.ts` و `site.spec.ts`
      # برایش نوشته شده‌اند. سقف باندل اولیه، «اولین قیمت زیر ۲ ثانیه»، رفتار چند فایل، و
      # سربرگ و پاورقی و ۴۰۴ فقط با همین مرحله قفل‌اند؛ پیش از برش ۲ب قدم ۴ هیچ‌کدام در CI
      # اجرا نمی‌شد. `upload.spec.ts`
      # سرویس واقعی و کارگر می‌خواهد و بی `E2E_UPLOAD_BASE_URL` خودش را رد می‌کند.
      - name: تست سرتاسری مرورگر
        run: |
          set -eux
          pnpm fixtures
          pnpm --filter @jozveyar/web exec playwright install --with-deps chromium
          pnpm --filter @jozveyar/web test:e2e

      # مسیر خرید، سرتاسری (برش ۳ج؛ ADR-033 تا ADR-035): همین build با `CHECKOUT_MODE=mock`، پستگرس و
      # Garage واقعی، و همان ایمیج کارگری که سرور می‌سازد (`docworker-smoke`). از «ادامه» تا «سفارش ثبت
      # شد»؛ کد پیامکی را تست از `sms_messages` می‌خواند (پیامک کنسولی). پایگاه دادهٔ تازه (`jy_e2e`)،
      # چون عددهای انتظار از `quote()` و تعرفهٔ پایه‌اند و پایگاه دادهٔ تست واحد ردیف‌های خودش را دارد.
      # `upload.spec.ts` هم همین‌جا: آپلود واقعی، و Word و عکس با LibreOffice کارگر. و `restore.spec.ts` (برش ۳د،
      # ADR-036): رفرش در هر قدم، «پرداخت» دوباره بعد از رفرش، سندی که دیگر روی سرور نیست، و زمان رفرش تا قیمت.
      # سرور روی پورت ۳۱۰۰ پیکربندی Playwright، تا Playwright سرور دومی بالا نیاورد (`reuseExistingServer`).
      # وب مهاجرت‌ها را پیش از اولین پاسخ اعمال می‌کند، پس کارگر بعد از «وب سالم» می‌آید (مثل compose تولید).
      # تعرفه از پایگاه داده (برش ۴٫۴، ADR-040، `tariff.spec.ts`) آخر و جدا: تعرفهٔ فعال را عوض می‌کند، و ISR صفحهٔ اصلی را
      # تا یک دقیقه با همان نگه می‌دارد؛ عددهای انتظار بقیه از تعرفهٔ پایه‌اند.
      - name: مسیر خرید، سرتاسری
        env:
          DATABASE_URL: postgresql://jozveyar:jozveyar@127.0.0.1:5432/jy_e2e
          S3_ENDPOINT: http://127.0.0.1:3900
          S3_PUBLIC_ENDPOINT: http://127.0.0.1:3900
          S3_BUCKET: jozveyar
          CHECKOUT_MODE: mock
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          DOCWORKER_POLL_SECONDS: '0.5'
        run: |
          set -eux
          docker run --rm --network host -e PGPASSWORD=jozveyar postgres:17-alpine \
            psql -h 127.0.0.1 -U jozveyar -d jozveyar -v ON_ERROR_STOP=1 -c 'CREATE DATABASE jy_e2e'
          SESSION_SECRET="$(openssl rand -hex 32)" \
            node apps/web/scripts/serve-standalone.mjs 3100 > "$RUNNER_TEMP/web.log" 2>&1 &
          timeout 120 sh -c 'until curl -sf http://127.0.0.1:3100/api/health > /dev/null; do sleep 1; done'
          grep -F 'مسیر خرید: mock' "$RUNNER_TEMP/web.log"
          docker run -d --name docworker --network host \
            -e DATABASE_URL -e S3_ENDPOINT -e S3_BUCKET -e S3_ACCESS_KEY -e S3_SECRET_KEY -e DOCWORKER_POLL_SECONDS \
            docworker-smoke
          cd apps/web
          E2E_CHECKOUT_BASE_URL=http://127.0.0.1:3100 E2E_UPLOAD_BASE_URL=http://127.0.0.1:3100 \
            pnpm exec playwright test tests/checkout.spec.ts tests/upload.spec.ts tests/restore.spec.ts
          E2E_TARIFF_BASE_URL=http://127.0.0.1:3100 pnpm exec playwright test tests/tariff.spec.ts

      - name: لاگ مسیر خرید، اگر افتاد
        if: failure()
        run: |
          cat "$RUNNER_TEMP/web.log" || true
          docker logs docworker || true

      # پنل ادمین، سرتاسری (برش ۴٫۱؛ ADR-037 و ADR-038): همان build پنل و همان دستور سرور، روی پایگاه دادهٔ
      # تازه‌ای (`jy_admin`) که یک وب جدا روی ۳۱۰۱ مهاجرت و نقش‌هایش را نوشته، مثل compose تولید (پنل بعد از «وب
      # سالم»). دروازهٔ مسیر محرمانه، ثبت با QR، ورود، قفل، متصدی، کار حساس با کد تازه، رویدادها، CSP و گوشی.
      # کد برنامهٔ تأیید را تست خودش از کلید صفحهٔ ثبت می‌سازد. رمزها همین‌جا تصادفی‌اند و `set -x` ندارد.
      # سفارش‌ها (برش ۴٫۲، ADR-039، `orders.spec.ts`): تست سفارش‌ها را با SQL می‌نشاند و فایل‌ها را به همین Garage
      # می‌برد؛ PDF جزوه را کارگر دومی از همان ایمیج (`docworker-admin`) روی `jy_admin` می‌سازد، و پنل از استوریج
      # داخلی دانلودش می‌کند. وضعیت سفارش (برش ۴٫۳، `status.spec.ts`) با همان پایگاه داده، استوریج و کارگر.
      # تعرفه در پنل (برش ۴٫۵، ADR-040، `tariff.spec.ts`) آخر، به ترتیب نام: تعرفهٔ فعال را عوض می‌کند و صفحهٔ اصلی همان
      # وب ۳۱۰۱ را تا ISR یک دقیقه‌ای می‌پاید (`E2E_WEB_BASE_URL`)؛ در پایان نسخهٔ ۱ دوباره فعال است.
      # تنظیمات و کلیدها (برش ۴٫۶، ADR-041، `settings.spec.ts`): `SMS_API_KEY` پنل تصادفی است (کلید «از .env»)، و مقداری
      # که تست از پنل وارد می‌کند `E2E_KEY_PROBE`؛ پس از اجرا هیچ‌کدام نباید در لاگ پنل یا وب باشد (`grep -q`، بی چاپ).
      # خروجی چاپ (برش ۵٫۱، ADR-043 و ADR-044، `print.spec.ts`): فایل چاپ هر جلد و برگهٔ سفارش را همان کارگر می‌سازد، و
      # فایل‌های سفارش بسته را پس از روزهای نگهداری پاک می‌کند؛ دور پاک کردن اینجا هر ۲ ثانیه (پیش‌فرض کارگر ده دقیقه).
      # چاپخانه‌ها و تخصیص (برش ۵٫۲، ADR-042، `partners.spec.ts`): زبانهٔ «چاپخانه‌ها»، جابه‌جایی با دلیل، هشدار «بی چاپخانه»، و برگه‌ای
      # که همان کارگر با چاپخانهٔ تازه دوباره می‌سازد؛ در پایان «چاپخانهٔ جزوه‌یار» پیش‌فرض است و چاپخانه‌های همان اجرا غیرفعال.
      # نقش چاپخانه و محدوده (برش ۵٫۳، ADR-042، `scope.spec.ts`): دو چاپخانه و دو کاربر چاپخانه که مالک از «ادمین‌ها» می‌سازد؛ هر کدام
      # فقط سفارش‌های خودش، بی مبلغ و بی لغو، و سفارش دیگری در صفحه، دانلود و هر کار ۴۰۴؛ چاپخانه‌های همان اجرا در پایان غیرفعال.
      # ارسال (برش ۶٫۱، ADR-045 و ADR-046، `shipments.spec.ts`): فایل پست ساختگی (جدول HTML با پسوند `.xls`) را همان کارگر با
      # `read_post_file` می‌خواند، بی استوریج؛ پیش‌نمایش با حکم هر سطر، «ثبت» با «تحویل پست شد»، «دور بینداز» و برگرداندن فقط با مالک.
      # صف تأیید و فایل چاپخانه (برش ۶٫۲، ADR-046 و ADR-047، `review.spec.ts`): پایگاه دادهٔ دورریختنی مثل `orders.spec.ts`، و دو
      # چاپخانه و دو کاربر چاپخانه مثل `scope.spec.ts`؛ متصدی صف را با «همین است»، «سفارش دیگر» و «هیچ‌کدام» می‌گذراند، دادن دستی از
      # «پیدا نشد»، کنار گذاشتن یک کد فقط با مالک، هشدارهای پیشخوان، و فایل پست کاربر چاپخانه فقط برای سفارش‌های خودش؛ چاپخانه‌های همان
      # اجرا در پایان غیرفعال.
      # گزارش ارسال (برش ۶٫۴، ADR-048، `report.spec.ts`): پایگاه دادهٔ دورریختنی مثل `review.spec.ts`؛ کد رهگیری از فایل پستی که همان
      # کارگر می‌خواند، عددهای ماه جاری و ماه قبل، بازه‌های وزن که مالک از گزارش عوض می‌کند و در پایان همان پیش از تست می‌شوند، و متصدی
      # و چاپخانه بی دکمه و بی صفحه.
      # پیامک sms.ir (برش ۷٫۱، ADR-049): sms.ir ساختگی روی ۳۳۰۰ (`SMSIR_API_URL`)، که «آزمایش» کلیدهای `settings.spec.ts` به آن می‌رود؛ اجرای
      # اصلی کنسولی است. بعد همان build پنل با `SMS_PROVIDER=smsir` و شناسهٔ قالب‌ها در `.env` روی ۳۲۰۱ و فقط `smsir.spec.ts`: پیامک رهگیری
      # و پرداخت با sms.ir، شکست ۵۰۰ و «دوباره بفرست»، اعتبار و هشدارهای پیشخوان. کلیدهای ساختگی هم در لاگ‌ها جسته می‌شوند.
      # درگاه زیبال (برش ۷٫۲، ADR-050، `payments.spec.ts`): زیبال ساختگی روی ۳۴۰۰ (`ZIBAL_API_URL`) با کد پذیرندهٔ تصادفی که پنل از `.env`
      # دارد؛ «استعلام از درگاه»، پرداخت دوم تا «برگشت خورد»، مبلغ ناهمخوان، و «آزمایش» کد پذیرنده با هشدار ۱۱۵. کد پذیرنده هم در لاگ‌ها
      # جسته می‌شود.
      # بازپرداخت (برش ۷٫۳، ADR-051، `refunds.spec.ts`): پنل سوم روی ۳۲۰۲ با `CHECKOUT_MODE=mock`، چون فقط درگاه نمونه بازپرداخت دارد (سؤال
      # ۱۵۲)؛ از درگاه تا «برگشت داده شد»، رد کیف پول و ثبت دستی، پاسخ گم‌شده، پیش‌استعلام، و صفحهٔ مشتری روی وب ۳۱۰۱. اجرای اصلی بی آن است و
      # این فایل خودش را رد می‌کند.
      - name: پنل، سرتاسری
        env:
          DATABASE_URL: postgresql://jozveyar:jozveyar@127.0.0.1:5432/jy_admin
          ADMIN_ORIGIN: http://127.0.0.1:3200
          E2E_ADMIN_BASE_URL: http://127.0.0.1:3200
          E2E_WEB_BASE_URL: http://127.0.0.1:3101
          S3_ENDPOINT: http://127.0.0.1:3900
          S3_BUCKET: jozveyar
          DOCWORKER_POLL_SECONDS: '0.5'
          DOCWORKER_RETENTION_SECONDS: '2'
          SMSIR_API_URL: http://127.0.0.1:3300
          # زیبال ساختگی (۷٫۲): «استعلام از درگاه» و «آزمایش» کد پذیرندهٔ پنل؛ نشانی برگشت همان سایت روی ۳۱۰۱.
          ZIBAL_API_URL: http://127.0.0.1:3400
          PAYMENT_CALLBACK_URL: http://127.0.0.1:3101/pay/callback
        run: |
          set -eu
          node packages/sms/mock/smsir.mjs 3300 > "$RUNNER_TEMP/smsir.log" 2>&1 &
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:3300/__mock/messages > /dev/null; do sleep 1; done'
          # کد پذیرندهٔ تصادفی، همان در .env پنل و تست؛ زیبال ساختگی فقط همین را می‌شناسد و هیچ‌جا چاپش نمی‌کند.
          PAYMENT_MERCHANT_ID="$(openssl rand -hex 16)"
          export PAYMENT_MERCHANT_ID
          ZIBAL_MOCK_MERCHANTS="$PAYMENT_MERCHANT_ID" node packages/payments/mock/zibal.mjs 3400 > "$RUNNER_TEMP/zibal.log" 2>&1 &
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:3400/__mock/transactions > /dev/null; do sleep 1; done'
          docker run --rm --network host -e PGPASSWORD=jozveyar postgres:17-alpine \
            psql -h 127.0.0.1 -U jozveyar -d jozveyar -v ON_ERROR_STOP=1 -c 'CREATE DATABASE jy_admin'
          node apps/web/scripts/serve-standalone.mjs 3101 > "$RUNNER_TEMP/web-admin.log" 2>&1 &
          timeout 120 sh -c 'until grep -qF "✓ دادهٔ پایه" "$0"; do sleep 1; done' "$RUNNER_TEMP/web-admin.log"
          docker run -d --name docworker-admin --network host \
            -e DATABASE_URL -e S3_ENDPOINT -e S3_BUCKET -e S3_ACCESS_KEY -e S3_SECRET_KEY -e DOCWORKER_POLL_SECONDS \
            -e DOCWORKER_RETENTION_SECONDS \
            docworker-smoke
          SESSION_SECRET="$(openssl rand -hex 32)"
          SECRETS_KEY="$(openssl rand -hex 32)"
          ADMIN_BASE_PATH="/$(openssl rand -hex 8)"
          SMS_API_KEY="$(openssl rand -hex 20)"
          E2E_KEY_PROBE="$(openssl rand -hex 20)"
          export SESSION_SECRET SECRETS_KEY ADMIN_BASE_PATH SMS_API_KEY E2E_KEY_PROBE
          node apps/admin/scripts/serve-standalone.mjs 3200 > "$RUNNER_TEMP/admin.log" 2>&1 &
          timeout 120 sh -c 'until curl -sf http://127.0.0.1:3200/api/health > /dev/null; do sleep 1; done'
          timeout 30 sh -c 'until grep -qF "⚠ پنل ادمین: هنوز هیچ ادمینی" "$0"; do sleep 1; done' "$RUNNER_TEMP/admin.log"
          grep -F '✓ پنل ادمین: آماده' "$RUNNER_TEMP/admin.log"
          if grep -F "$ADMIN_BASE_PATH" "$RUNNER_TEMP/admin.log"; then echo 'مسیر محرمانه در لاگ پنل آمد' >&2; exit 1; fi
          timeout 30 sh -c 'until grep -qF "✓ پنل ادمین: کلیدهای سرویس‌ها — SMS_API_KEY از .env" "$0"; do sleep 1; done' "$RUNNER_TEMP/admin.log"
          grep -F '✓ پنل ادمین: پیامک کنسولی (در sms_messages)' "$RUNNER_TEMP/admin.log"
          grep -F '✓ پنل ادمین: درگاه زیبال (ZIBAL_API_URL) برای «استعلام از درگاه»؛ PAYMENT_CALLBACK_URL هست؛ بازپرداخت فقط ثبت دستی' "$RUNNER_TEMP/admin.log"
          cd apps/admin
          pnpm exec playwright test
          # پیامک با sms.ir (۷٫۱): همان build، پنل دوم روی ۳۲۰۱ با SMS_PROVIDER=smsir؛ پنل اول می‌ماند و کاری با آن نیست.
          export SMS_PROVIDER=smsir SMS_OTP_TEMPLATE=100001 SMS_PAID_TEMPLATE=100002 SMS_TRACKING_TEMPLATE=100003
          ADMIN_ORIGIN=http://127.0.0.1:3201 node scripts/serve-standalone.mjs 3201 > "$RUNNER_TEMP/admin-smsir.log" 2>&1 &
          timeout 120 sh -c 'until curl -sf http://127.0.0.1:3201/api/health > /dev/null; do sleep 1; done'
          timeout 30 sh -c 'until grep -qF "✓ پنل ادمین: پیامک sms.ir (SMS_PROVIDER=smsir)" "$0"; do sleep 1; done' "$RUNNER_TEMP/admin-smsir.log"
          ADMIN_ORIGIN=http://127.0.0.1:3201 E2E_ADMIN_BASE_URL=http://127.0.0.1:3201 pnpm exec playwright test tests/smsir.spec.ts
          # بازپرداخت (۷٫۳، ADR-051): همان build، پنل سوم روی ۳۲۰۲ با CHECKOUT_MODE=mock، که فقط درگاه نمونه را با بازپرداخت دارد (سؤال ۱۵۲)،
          # و فقط `refunds.spec.ts`؛ صفحهٔ مشتری همان وب ۳۱۰۱. هیچ درخواستی به زیبال واقعی نمی‌رود و پولی جابه‌جا نمی‌شود.
          unset SMS_PROVIDER
          export CHECKOUT_MODE=mock
          ADMIN_ORIGIN=http://127.0.0.1:3202 node scripts/serve-standalone.mjs 3202 > "$RUNNER_TEMP/admin-refunds.log" 2>&1 &
          timeout 120 sh -c 'until curl -sf http://127.0.0.1:3202/api/health > /dev/null; do sleep 1; done'
          timeout 30 sh -c 'until grep -qF "بازپرداخت از درگاه نمونه، با استعلام خودکار" "$0"; do sleep 1; done' "$RUNNER_TEMP/admin-refunds.log"
          ADMIN_ORIGIN=http://127.0.0.1:3202 E2E_ADMIN_BASE_URL=http://127.0.0.1:3202 pnpm exec playwright test tests/refunds.spec.ts
          for secret in "$SMS_API_KEY" "$E2E_KEY_PROBE" "$PAYMENT_MERCHANT_ID"; do
            for log in "$RUNNER_TEMP/admin.log" "$RUNNER_TEMP/admin-smsir.log" "$RUNNER_TEMP/admin-refunds.log" "$RUNNER_TEMP/web-admin.log" "$RUNNER_TEMP/smsir.log" "$RUNNER_TEMP/zibal.log"; do
              if grep -qF "$secret" "$log"; then echo "مقدار کلید در $(basename "$log") آمد" >&2; exit 1; fi
            done
          done

      - name: لاگ پنل، اگر افتاد
        if: failure()
        run: |
          cat "$RUNNER_TEMP/web-admin.log" || true
          cat "$RUNNER_TEMP/admin.log" || true
          cat "$RUNNER_TEMP/admin-smsir.log" || true
          cat "$RUNNER_TEMP/admin-refunds.log" || true
          cat "$RUNNER_TEMP/smsir.log" || true
          cat "$RUNNER_TEMP/zibal.log" || true
          docker logs docworker-admin || true

      # خروجی standalone دو چیز را خودش نمی‌آورد و باید کنار server.js بنشینند.
      # همان مراحل serve-standalone.mjs، اینجا برای بسته‌بندی.
      - name: مونتاژ بسته
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -eux
          OUT=apps/web/.next/standalone
          cp -r apps/web/.next/static "$OUT/apps/web/.next/static"
          cp -r apps/web/public "$OUT/apps/web/public"
          # commit سازنده داخل خود بسته: deploy-bundle.sh تا وقتی بسته از همان
          # commitی که git pull آورد ساخته نشده، مستقرش نمی‌کند — نه CDN کهنه
          # و نه CI نیمه‌کاره نسخهٔ قدیمی را بی‌صدا مستقر نمی‌کنند.
          echo "$GITHUB_SHA" > "$OUT/COMMIT"
          # مهاجرت‌ها: اپ موقع بالا آمدن اجرایشان می‌کند (instrumentation.ts).
          mkdir -p "$OUT/packages/db"
          cp -r packages/db/migrations "$OUT/packages/db/migrations"
          tar -czf jozveyar-bundle.tar.gz -C "$OUT" .
          ls -lh jozveyar-bundle.tar.gz

      # بستهٔ پنل ادمین، مثل وب: standalone، استاتیک و public کنارش، دستور سرور، و commit. `-T` یعنی محتوا به
      # همان پوشه، حتی اگر اجرای سرتاسری پیش‌تر ساخته باشدش. مهاجرت ندارد؛ آن با وب است.
      - name: مونتاژ بستهٔ پنل
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -eux
          OUT=apps/admin/.next/standalone
          mkdir -p "$OUT/apps/admin/.next/static" "$OUT/apps/admin/public" "$OUT/apps/admin/dist"
          cp -rT apps/admin/.next/static "$OUT/apps/admin/.next/static"
          cp -rT apps/admin/public "$OUT/apps/admin/public"
          cp apps/admin/dist/cli.mjs "$OUT/apps/admin/dist/cli.mjs"
          echo "$GITHUB_SHA" > "$OUT/COMMIT"
          tar -czf jozveyar-admin.tar.gz -C "$OUT" .
          ls -lh jozveyar-admin.tar.gz

      # اثر انگشت، تا سرور بفهمد نسخهٔ جدید آمده یا نه.
      - name: اثر انگشت
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          sha256sum jozveyar-bundle.tar.gz | cut -d' ' -f1 > jozveyar-bundle.sha256
          sha256sum jozveyar-admin.tar.gz | cut -d' ' -f1 > jozveyar-admin.sha256
          cat jozveyar-bundle.sha256 jozveyar-admin.sha256

      # ایمیج پایهٔ کارگر — فقط اگر این شناسه تازه است، و **قبل از** بستهٔ کد:
      # بسته‌ای که به پایهٔ منتشرنشده اشاره کند هیچ‌وقت منتشر نمی‌شود. تگ
      # `docworker-base-<شناسه>` هرگز بازنویسی نمی‌شود، پس CDN کهنه (ADR-019) اینجا
      # بی‌معناست. تکه‌های ۴۰ مگابایتی، هر کدام با اثر انگشت خودش: لینک سرور روی
      # فایل بزرگ می‌افتد و تکهٔ افتاده جدا دوباره گرفته می‌شود.
      - name: بسته‌بندی ایمیج پایه
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.base.outputs.published != 'true'
        run: |
          set -eux
          rm -rf base-out && mkdir base-out
          docker save "${{ steps.base.outputs.image }}" | gzip -n > base-out/image.tar.gz
          ls -lh base-out/image.tar.gz
          cd base-out
          split -b 40m -d -a 2 image.tar.gz jozveyar-docworker-base.tar.gz.part-
          rm image.tar.gz
          sha256sum jozveyar-docworker-base.tar.gz.part-* > jozveyar-docworker-base.sha256
          cat jozveyar-docworker-base.sha256

      - name: انتشار ایمیج پایه
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.base.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: docworker-base-${{ steps.base.outputs.id }}
          name: ایمیج پایهٔ کارگر ${{ steps.base.outputs.id }}
          body: |
            LibreOffice، فونت‌ها و چرخ‌های پایتون کارگر اسناد (ADR-027)، ساخته‌شده از `${{ github.sha }}`.

            سرور خودش با `./infra/deploy-bundle.sh` برش می‌دارد؛ کار دستی ندارد.
          files: |
            base-out/jozveyar-docworker-base.tar.gz.part-*
            base-out/jozveyar-docworker-base.sha256
          prerelease: true
          make_latest: false

      # پنج پایهٔ آخر برای برگشت به نسخهٔ قبل کافی است؛ هر کدام ~۲۵۰ مگابایت.
      - name: پاک‌سازی ایمیج‌های پایهٔ قدیمی
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.base.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("docworker-base-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r tag; do
              echo "حذف $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

      # انتشار زیر تگ ثابت `bundle-latest`: سرور همیشه یک آدرس می‌شناسد و
      # لازم نیست شمارهٔ نسخه را جایی نگه دارد.
      - name: انتشار
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bundle-latest
          name: آخرین بستهٔ آمادهٔ اجرا
          body: |
            خروجی standalone ساخته‌شده از `${{ github.sha }}`.

            روی سرور: `./infra/deploy-bundle.sh`
          # اثر انگشت‌ها آخر: deploy-bundle.sh اول اثر انگشت را می‌خواند و بعد
          # بسته را. اگر وسط انتشار برسد، ناهمخوانی را می‌بیند و صبر می‌کند.
          files: |
            jozveyar-bundle.tar.gz
            jozveyar-docworker.tar.gz
            jozveyar-admin.tar.gz
            jozveyar-bundle.sha256
            jozveyar-docworker.sha256
            jozveyar-admin.sha256
          prerelease: true
